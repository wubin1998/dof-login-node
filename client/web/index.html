<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DOF 登录器 · 地下城与勇士</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23ffe9a8'/%3E%3Cstop offset='.55' stop-color='%23f7c65a'/%3E%3Cstop offset='1' stop-color='%23ff7a3c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='%230b0d16'/%3E%3Cpath d='M32 8 54 21v22L32 56 10 43V21L32 8Z' fill='none' stroke='url(%23g)' stroke-width='2'/%3E%3Cpath d='M23 20h11c7 0 12 4 12 12s-5 12-12 12H23V20Z' fill='url(%23g)'/%3E%3Cpath d='M29 26h5c3 0 5 2 5 6s-2 6-5 6h-5V26Z' fill='%230b0d16'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="stage" aria-hidden="true">
  <div class="grid"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="beam"></div>
  <div class="grain"></div>
</div>

<main class="app">
  <section class="brand">
    <header class="brand-head">
      <div class="mark">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="brandGrad" x1="7" y1="5" x2="42" y2="44" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ffe9a8"/><stop offset=".55" stop-color="#f7c65a"/><stop offset="1" stop-color="#ff7a3c"/>
            </linearGradient>
          </defs>
          <path d="M24 3.5 43 15v18L24 44.5 5 33V15L24 3.5Z" stroke="url(#brandGrad)" stroke-width="2"/>
          <path d="M24 10 37.5 18.6v10.8L24 38 10.5 29.4V18.6L24 10Z" stroke="url(#brandGrad)" stroke-width=".9" opacity=".35"/>
          <path d="M16 14.5h9.8c6.2 0 10.4 3.7 10.4 9.5s-4.2 9.5-10.4 9.5H16v-19Z" fill="url(#brandGrad)"/>
          <path d="M22 19.6h3.7c2.7 0 4.5 1.8 4.5 4.4s-1.8 4.4-4.5 4.4H22v-8.8Z" fill="#0a0c14"/>
        </svg>
      </div>
      <div class="brand-title">
        <div class="wordmark">DOF <span>LOGIN</span></div>
        <div class="wordmark-sub">地下城与勇士 · 登录客户端</div>
      </div>
    </header>

    <div class="hero">
      <div class="sigil" aria-hidden="true">
        <div class="halo"></div>
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring-dot d1"></div>
        <div class="ring-dot d2"></div>
        <div class="ring-dot d3"></div>
        <div class="core">
          <span>D</span>
        </div>
        <div class="flare f1"></div>
        <div class="flare f2"></div>
      </div>
      <h1>欢迎回来，<em>勇士</em></h1>
      <p>集结你的伙伴，重返阿拉德大陆。<br>使用账号登录，或创建一位新的冒险者。</p>
      <div class="chips">
        <span class="chip"><i class="dot"></i><span id="serverChip">192.168.200.131:3306</span></span>
        <span class="chip ghost">v1.0.0</span>
      </div>
    </div>

    <footer class="brand-foot">
      <span class="net" id="brandStatus"><i></i><span>正在检测服务器…</span></span>
      <span class="signature">DOF LOGIN CLIENT</span>
    </footer>
  </section>

  <section class="card" id="card">
    <div class="card-aura" aria-hidden="true"></div>
    <span class="corner c-tl" aria-hidden="true"></span>
    <span class="corner c-br" aria-hidden="true"></span>

    <header class="card-head">
      <nav class="tabs" id="tabs" data-active="login">
        <button type="button" class="tab active" data-tab="login">登录</button>
        <button type="button" class="tab" data-tab="register">注册</button>
        <span class="tab-ink" aria-hidden="true"></span>
      </nav>
      <button type="button" class="icon-btn" id="settingsBtn" title="服务器设置" aria-label="服务器设置">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M19.4 13.5a7.7 7.7 0 0 0 .05-1.5 7.7 7.7 0 0 0-.05-1.5l2-1.55-2-3.4-2.35.95a7.7 7.7 0 0 0-2.6-1.5L14.1 2.5h-4l-.35 2.55a7.7 7.7 0 0 0-2.6 1.5L4.8 5.6l-2 3.4 2 1.55a7.7 7.7 0 0 0 0 3l-2 1.55 2 3.4 2.35-.95a7.7 7.7 0 0 0 2.6 1.5l.35 2.55h4l.35-2.55a7.7 7.7 0 0 0 2.6-1.5l2.35.95 2-3.4-2-1.55Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <div class="forms" id="forms">
      <form class="form active" id="loginForm" novalidate autocomplete="off">
        <label class="field" data-field>
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="1.6"/><path d="M4.8 20c.7-3.3 3.7-5.2 7.2-5.2s6.5 1.9 7.2 5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <input id="loginUser" name="username" type="text" placeholder="请输入账号" maxlength="32" spellcheck="false" autocomplete="username">
          <span class="field-line"></span>
        </label>
        <label class="field" data-field>
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4.5" y="10" width="15" height="10" rx="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7.6a4 4 0 1 1 8 0V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="15" r="1.3" fill="currentColor"/></svg>
          </span>
          <input id="loginPass" name="password" type="password" placeholder="请输入密码" maxlength="64" autocomplete="current-password">
          <button type="button" class="eye" data-eye aria-label="显示密码">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.8 12S6.5 5.8 12 5.8 21.2 12 21.2 12 17.5 18.2 12 18.2 2.8 12 2.8 12Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4l16 16M9.9 5.2A9.9 9.9 0 0 1 12 5.8c5.5 0 9.2 6.2 9.2 6.2a17 17 0 0 1-3.2 3.9M6.1 7.1A17 17 0 0 0 2.8 12S6.5 18.2 12 18.2c1 0 1.9-.2 2.8-.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <span class="field-line"></span>
        </label>

        <div class="meta-row">
          <label class="check">
            <input type="checkbox" id="remember">
            <span class="box"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2 4.7 9 10 3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            记住账号
          </label>
          <button type="button" class="link" id="forgotBtn">忘记密码？</button>
        </div>

        <button type="submit" class="submit" id="loginBtn">
          <span class="shine" aria-hidden="true"></span>
          <span class="submit-text">进入游戏</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <p class="tip">登录成功后将自动启动 <b>DNF.exe</b></p>
      </form>

      <form class="form" id="registerForm" novalidate autocomplete="off">
        <label class="field" data-field>
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="1.6"/><path d="M4.8 20c.7-3.3 3.7-5.2 7.2-5.2s6.5 1.9 7.2 5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <input id="regUser" name="username" type="text" placeholder="设置账号（2-20 个字符）" maxlength="20" spellcheck="false">
          <span class="field-line"></span>
        </label>
        <label class="field" data-field>
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4.5" y="10" width="15" height="10" rx="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7.6a4 4 0 1 1 8 0V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="15" r="1.3" fill="currentColor"/></svg>
          </span>
          <input id="regPass" name="password" type="password" placeholder="设置密码" maxlength="64">
          <button type="button" class="eye" data-eye aria-label="显示密码">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.8 12S6.5 5.8 12 5.8 21.2 12 21.2 12 17.5 18.2 12 18.2 2.8 12 2.8 12Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4l16 16M9.9 5.2A9.9 9.9 0 0 1 12 5.8c5.5 0 9.2 6.2 9.2 6.2a17 17 0 0 1-3.2 3.9M6.1 7.1A17 17 0 0 0 2.8 12S6.5 18.2 12 18.2c1 0 1.9-.2 2.8-.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <span class="field-line"></span>
        </label>
        <label class="field" data-field>
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11Z" stroke="currentColor" stroke-width="1.5"/><path d="M9.2 10.2 11.3 12.3 15 8.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <input id="regPass2" name="password2" type="password" placeholder="再次输入密码" maxlength="64">
          <span class="field-line"></span>
        </label>

        <div class="meta-row">
          <span class="hint-inline">注册后自动获得 100000 点券</span>
          <button type="button" class="link" id="toLogin">已有账号？</button>
        </div>

        <button type="submit" class="submit" id="registerBtn">
          <span class="shine" aria-hidden="true"></span>
          <span class="submit-text">创建账号</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <p class="tip">请牢记账号密码，注册成功后即可登录</p>
      </form>
    </div>

    <footer class="card-foot">
      <span class="net" id="cardStatus"><i></i><span>正在连接服务器…</span></span>
      <span class="foot-brand">v1.0.0</span>
    </footer>

    <div class="success-veil" id="successVeil" hidden>
      <div class="success-ring">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5 9.5 17 19 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h3>登录成功</h3>
      <p>正在启动 DNF.exe，请稍候…</p>
      <span class="success-bar"><i></i></span>
    </div>
  </section>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="modal-mask" id="cfgMask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cfgTitle">
    <header class="modal-head">
      <div>
        <h3 id="cfgTitle">服务器设置</h3>
        <p>修改后会立即生效，并保存在本机</p>
      </div>
      <button type="button" class="icon-btn" id="cfgClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="modal-body">
      <label class="mini-field">
        <span>服务器地址</span>
        <input id="cfgServer" type="text" placeholder="192.168.200.131" spellcheck="false">
      </label>
      <div class="mini-row">
        <label class="mini-field">
          <span>数据库端口</span>
          <input id="cfgPort" type="number" min="1" max="65535" placeholder="3306">
        </label>
        <label class="mini-field">
          <span>数据库密码</span>
          <input id="cfgPass" type="password" placeholder="留空保持不变">
        </label>
      </div>
      <label class="mini-field">
        <span>游戏路径 <em>可选</em></span>
        <input id="cfgGame" type="text" placeholder="留空则使用登录器同目录的 DNF.exe" spellcheck="false">
      </label>
      <div class="test-row">
        <button type="button" class="btn-ghost" id="testBtn">测试连接</button>
        <span class="test-result" id="testResult">尚未测试</span>
      </div>
    </div>
    <footer class="modal-foot">
      <button type="button" class="btn-ghost" id="cfgCancel">取消</button>
      <button type="button" class="btn-primary" id="cfgSave">保存设置</button>
    </footer>
  </div>
</div>

<script>window.__DOF_TOKEN__ = "__DOF_TOKEN__";</script>
<script src="/app.js"></script>
</body>
</html>
